name: release-drafter
on:
  workflow_dispatch: {}
  push:
    branches:
      - main
jobs:
  release-drafter:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Get Next Version
        id: semver
        uses: ietf-tools/semver-action@46feaa27e7375da0e3d602721e9fb9573598b880 # v1
        with:
          token: ${{ github.token }}
          branch: main
          majorList: breaking
          minorList: feat, feature
          patchList: fix, bugfix, perf, refactor, test, tests, chore, doc
          skipInvalidTags: true
          fallbackTag: v0.0.0
      - name: Draft Release
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          commitish: main
          disable-autolabeler: true
          version: ${{ steps.semver.outputs.next }}
